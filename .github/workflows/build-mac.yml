name: build-mac

# Builds EshanAI.app on a free GitHub cloud Mac whenever the repo changes.
# After a run finishes: Actions tab → run → download "EshanAI-Mac" artifact.

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15-intel    # Intel x64 (macos-13 label retired → queued forever);
                               # runs on Apple Silicon via Rosetta too
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt pyinstaller

      - name: Build EshanAI.app
        run: cd EshanAI && pyinstaller EshanAI_Mac.spec --noconfirm

      - name: Zip the app bundle
        run: |
          cd EshanAI/dist
          zip -qry EshanAI-Mac.zip EshanAI.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EshanAI-Mac
          path: EshanAI/dist/EshanAI-Mac.zip
          if-no-files-found: error
          retention-days: 30
